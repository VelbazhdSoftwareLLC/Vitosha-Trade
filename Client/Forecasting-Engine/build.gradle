plugins {
    id 'java-library'
}

java {
    sourceCompatibility = JavaVersion.VERSION_24
    targetCompatibility = JavaVersion.VERSION_24
}

dependencies {
    implementation "org.deeplearning4j:deeplearning4j-core:1.0.0-M2.1"
    implementation "org.nd4j:nd4j-native-platform:1.0.0-M2.1"
    implementation 'ch.qos.logback:logback-classic:1.2.11'
    implementation group: 'org.encog', name: 'encog-core', version: '3.4'
    implementation group: 'org.json', name: 'json', version: '20260814'
    implementation group: 'cz.msebera.android', name: 'httpclient', version: '4.5.8'
    implementation group: 'org.moeaframework', name: 'moeaframework', version: '4.5'
    implementation group: 'org.apache.commons', name: 'commons-math3', version: '3.6.1'
    implementation group: 'org.mariuszgromada.math', name: 'MathParser.org-mXparser', version: '6.1.1'
    implementation group: 'edu.gmu.cs', name: 'ecj', version: '22'
    implementation group: 'io.jenetics', name: 'jenetics', version: '8.3.0'
}
